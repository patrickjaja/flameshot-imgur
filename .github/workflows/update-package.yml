name: Auto Update Package

on:
  schedule:
    # Runs at 3 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout aur branch
        run: |
          git fetch origin aur:aur || echo "No aur branch yet"
          git worktree add aur-branch aur || git worktree add -b aur aur-branch

      - name: Get current package version
        id: current
        run: |
          if [ -f aur-branch/PKGBUILD ]; then
            CURRENT_VERSION=$(grep "^pkgver=" aur-branch/PKGBUILD | cut -d'=' -f2)
          else
            CURRENT_VERSION="0.0.0"
          fi
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Get latest Flameshot release
        id: latest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/flameshot-org/flameshot/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST_VERSION}"

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" != "${{ steps.latest.outputs.version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed, already at version ${{ steps.current.outputs.version }}"
          fi

      - name: Create/Update PKGBUILD
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd aur-branch
          
          # Download and get SHA256
          wget -q "https://github.com/flameshot-org/flameshot/archive/v${{ steps.latest.outputs.version }}.tar.gz"
          SHA256=$(sha256sum "v${{ steps.latest.outputs.version }}.tar.gz" | cut -d' ' -f1)
          rm "v${{ steps.latest.outputs.version }}.tar.gz"
          
          # Create PKGBUILD
          cat > PKGBUILD << 'EOF'
# Maintainer: patrickjaja <patrickjajaa@gmail.com>

pkgname=flameshot-imgur
_pkgname=flameshot
pkgver=${{ steps.latest.outputs.version }}
pkgrel=1
pkgdesc="Powerful yet simple to use screenshot software with Imgur upload support enabled"
arch=('i686' 'x86_64' 'aarch64' 'armv7h')
url="https://github.com/flameshot-org/flameshot"
license=('GPL-3.0-or-later')
depends=('qt6-base' 'qt6-svg' 'hicolor-icon-theme' 'kguiaddons')
makedepends=('qt6-tools' 'cmake' 'ninja')
optdepends=(
    'gnome-shell-extension-appindicator: for system tray icon if you are using Gnome'
    'grim: for wlroots wayland support'
    'xdg-desktop-portal: for wayland support, you will need the implementation for your wayland desktop environment'
    'qt6-imageformats: for additional export image formats (e.g. tiff, webp, and more)'
)
provides=('flameshot')
conflicts=('flameshot' 'flameshot-git' 'flameshot-imgur-git')
source=("$_pkgname-$pkgver.tar.gz::https://github.com/flameshot-org/flameshot/archive/v${pkgver}.tar.gz")
sha256sums=('SHA256_PLACEHOLDER')

build() {
    cd "${srcdir}/${_pkgname}-${pkgver}"

    cmake -GNinja -B build -S . \
        -DCMAKE_BUILD_TYPE=None \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DUSE_WAYLAND_CLIPBOARD=1 \
        -DDISABLE_UPDATE_CHECKER=1 \
        -DENABLE_IMGUR=ON

    cmake --build build
}

package() {
    cd "${srcdir}/${_pkgname}-${pkgver}"
    DESTDIR="${pkgdir}" cmake --install build
}
EOF
          
          # Replace SHA256 placeholder
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" PKGBUILD
          
          echo "Created PKGBUILD for version ${{ steps.latest.outputs.version }}"

      - name: Generate .SRCINFO
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd aur-branch
          
          # Use Docker to generate .SRCINFO with Arch Linux environment
          docker run --rm -v "$PWD":/pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm base-devel &&
            cd /pkg &&
            chown -R nobody:nobody . &&
            su nobody -s /bin/bash -c 'makepkg --printsrcinfo' > .SRCINFO
          "

      - name: Create .gitignore for AUR branch
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd aur-branch
          cat > .gitignore << 'EOF'
# Build directories
src/
pkg/
build/

# Source archives
*.tar.gz
*.tar.xz
*.tar.bz2
*.zip

# Compiled packages
*.pkg.tar*

# Log files
*.log

# Backup files
*~
*.bak
*.orig
EOF

      - name: Commit and push AUR branch to GitHub
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd aur-branch
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add PKGBUILD .SRCINFO .gitignore
          git commit -m "Update to version ${{ steps.latest.outputs.version }}

          Automated update from Flameshot v${{ steps.latest.outputs.version }}
          Release: https://github.com/flameshot-org/flameshot/releases/tag/v${{ steps.latest.outputs.version }}"
          
          git push origin aur

      - name: Setup SSH for AUR
        if: steps.check.outputs.update_needed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking no
          EOF

      - name: Push to AUR
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd aur-branch
          
          # Add AUR remote if not exists
          git remote add aur ssh://aur@aur.archlinux.org/flameshot-imgur.git 2>/dev/null || true
          
          # Push only the aur branch content to AUR's master
          git push aur aur:master --force

      - name: Create GitHub Release
        if: steps.check.outputs.update_needed == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.latest.outputs.version }}
          release_name: Flameshot Imgur v${{ steps.latest.outputs.version }}
          body: |
            Automated update to match upstream Flameshot v${{ steps.latest.outputs.version }}
            
            This package includes Imgur upload support enabled via `-DENABLE_IMGUR=ON`
            
            Install with: `yay -S flameshot-imgur`
          draft: false
          prerelease: false