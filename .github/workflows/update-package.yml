name: Auto Update Package

on:
  schedule:
    # Runs at 3 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Flameshot version to update to (e.g., 13.3.0). Leave empty for latest.'
        required: false
        type: string
      force_update:
        description: 'Force update even if version matches (useful for fixing checksums)'
        required: false
        type: boolean
        default: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current package version
        id: current
        run: |
          CURRENT_VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Get latest Flameshot release
        id: latest
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            LATEST_VERSION="${{ inputs.version }}"
            echo "Using manually specified version: ${LATEST_VERSION}"
          else
            LATEST_VERSION=$(curl -s https://api.github.com/repos/flameshot-org/flameshot/releases/latest | jq -r '.tag_name' | sed 's/^v//')
            echo "Latest version from GitHub API: ${LATEST_VERSION}"
          fi
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ inputs.force_update }}" = "true" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Force update requested for version ${{ steps.latest.outputs.version }}"
          elif [ "${{ steps.current.outputs.version }}" != "${{ steps.latest.outputs.version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed, already at version ${{ steps.current.outputs.version }}"
          fi

      - name: Update PKGBUILD version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Update version
          sed -i "s/^pkgver=.*/pkgver=${{ steps.latest.outputs.version }}/" PKGBUILD

          # Reset pkgrel to 1 for new version (unless force_update is used)
          if [ "${{ inputs.force_update }}" != "true" ]; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

          echo "Waiting 5 seconds for GitHub to finalize tarball..."
          sleep 5

          # Download tarball twice to verify consistency
          echo "Downloading tarball (attempt 1)..."
          wget -q "https://github.com/flameshot-org/flameshot/archive/v${{ steps.latest.outputs.version }}.tar.gz" -O v${{ steps.latest.outputs.version }}-1.tar.gz
          SHA256_1=$(sha256sum "v${{ steps.latest.outputs.version }}-1.tar.gz" | cut -d' ' -f1)
          echo "SHA256 (attempt 1): ${SHA256_1}"

          sleep 2

          echo "Downloading tarball (attempt 2)..."
          wget -q "https://github.com/flameshot-org/flameshot/archive/v${{ steps.latest.outputs.version }}.tar.gz" -O v${{ steps.latest.outputs.version }}-2.tar.gz
          SHA256_2=$(sha256sum "v${{ steps.latest.outputs.version }}-2.tar.gz" | cut -d' ' -f1)
          echo "SHA256 (attempt 2): ${SHA256_2}"

          # Verify checksums match
          if [ "${SHA256_1}" != "${SHA256_2}" ]; then
            echo "ERROR: Downloaded tarballs have different checksums!"
            echo "  First:  ${SHA256_1}"
            echo "  Second: ${SHA256_2}"
            echo "This indicates GitHub is regenerating the tarball. Aborting."
            exit 1
          fi

          echo "✅ Checksum verification passed: ${SHA256_1}"

          # Update PKGBUILD with verified SHA256
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256_1}')/" PKGBUILD

          # Cleanup
          rm "v${{ steps.latest.outputs.version }}-1.tar.gz" "v${{ steps.latest.outputs.version }}-2.tar.gz"

          echo "Updated PKGBUILD to version ${{ steps.latest.outputs.version }}"
          echo "Verified SHA256: ${SHA256_1}"


      - name: Generate .SRCINFO
        if: steps.check.outputs.update_needed == 'true'
        run: |
          docker run --rm -v "$PWD":/pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm base-devel &&
            useradd -m -G wheel builduser &&
            cd /pkg &&
            chown -R builduser:builduser . &&
            su - builduser -c 'cd /pkg && makepkg --printsrcinfo' > .SRCINFO
          "
          # Fix ownership back to the runner user
          sudo chown -R $(id -u):$(id -g) .

      - name: Commit and push to GitHub
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Get the SHA256 from PKGBUILD for the commit message
          SHA256=$(grep "^sha256sums=" PKGBUILD | sed "s/sha256sums=('\(.*\)')/\1/")

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${{ steps.latest.outputs.version }}

          Automated update from Flameshot v${{ steps.latest.outputs.version }}
          Release: https://github.com/flameshot-org/flameshot/releases/tag/v${{ steps.latest.outputs.version }}

          Verified SHA256: ${SHA256}"

          git push origin main

      - name: Setup SSH for AUR
        if: steps.check.outputs.update_needed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking no
          EOF

      - name: Push to AUR
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Clone the existing AUR repo
          git clone ssh://aur@aur.archlinux.org/flameshot-imgur.git aur-temp || {
            # If repo doesn't exist on AUR, create it
            mkdir aur-temp
            cd aur-temp
            git init
            git remote add origin ssh://aur@aur.archlinux.org/flameshot-imgur.git
            cd ..
          }
          
          # Copy ONLY the files AUR allows (no subdirectories)
          cp PKGBUILD .SRCINFO aur-temp/
          cp .gitignore aur-temp/ 2>/dev/null || true
          
          # Go to AUR temp directory
          cd aur-temp
          
          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          
          # Add and commit if there are changes
          git add PKGBUILD .SRCINFO
          [ -f .gitignore ] && git add .gitignore
          
          if git diff --staged --quiet; then
            echo "No changes to push to AUR"
          else
            git commit -m "Update to version ${{ steps.latest.outputs.version }}"
            git push origin master
            echo "✅ Pushed to AUR successfully"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.update_needed == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.latest.outputs.version }}
          release_name: Flameshot Imgur v${{ steps.latest.outputs.version }}
          body: |
            Automated update to match upstream Flameshot v${{ steps.latest.outputs.version }}
            
            This package includes Imgur upload support enabled via `-DENABLE_IMGUR=ON`
            
            Install with: `yay -S flameshot-imgur`
          draft: false
          prerelease: false
